<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Flow Kit</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="theme.css">
  <style>
    html, body { width: 372px; min-height: 200px; }

    #log-list { max-height: 440px; overflow-y: auto; }

    .entry { border-bottom: 1px solid var(--line); }

    .entry-row {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 14px;
      cursor: pointer; user-select: none;
      transition: background 0.1s;
    }
    .entry-row:hover { background: rgba(255, 255, 255, 0.03); }
    .entry.open .entry-row { background: var(--accent-soft); }

    .entry-id { font-size: 10px; color: var(--fg-muted); min-width: 56px; flex-shrink: 0; }
    .entry-type { flex: 1; font-size: 11px; color: var(--accent); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .entry-time { font-size: 10px; color: var(--fg-muted); flex-shrink: 0; font-variant-numeric: tabular-nums; }

    .expand-icon { font-size: 9px; color: var(--fg-muted); flex-shrink: 0; transition: transform 0.15s; }
    .entry.open .expand-icon { transform: rotate(90deg); color: var(--accent); }

    .entry-details { display: none; padding: 2px 14px 12px; background: rgba(0, 0, 0, 0.22); border-top: 1px solid var(--line); }
    .entry.open .entry-details { display: block; }

    .detail-section { margin-top: 8px; }
    .detail-label { font-size: 11px; color: var(--fg-2); margin-bottom: 4px; }
    .detail-value {
      font-size: 10px; color: var(--fg);
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--line);
      border-radius: 8px; padding: 6px 9px;
      word-break: break-all; white-space: pre-wrap;
      max-height: 90px; overflow-y: auto;
      line-height: 1.55;
    }
    .detail-value.url { color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-height: none; }
    .detail-error { color: #ffc9c9; background: rgba(255, 107, 107, 0.07); border-color: rgba(255, 107, 107, 0.35); }

    .footer {
      padding: 8px 14px;
      border-top: 1px solid var(--line);
      font-size: 11px; color: var(--fg-muted); text-align: center;
    }

    @media (prefers-reduced-motion: reduce) { .expand-icon, .entry-row { transition: none; } }
  </style>
</head>
<body>
  <header>
    <span class="brand-mark">F</span>
    <div class="header-title">Flow Kit <span>extension</span></div>
    <button id="btn-dashboard" class="btn">Dashboard</button>
    <button id="btn-panel">Side panel</button>
  </header>

  <div class="log-header">
    Recent requests
    <span id="log-count">0</span>
  </div>

  <div id="log-list">
    <div class="log-empty">No requests yet</div>
  </div>

  <div class="footer">Click a row to expand details</div>

  <script src="popup.js"></script>
</body>
</html>
